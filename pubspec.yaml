name: moving_pixel
description: A Neon Puzzle Game built with Flutter & Flame.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Oyun Motoru ve Ses
  flame: ^1.20.0
  flame_audio: ^2.1.0

  # Reklam ve Kayıt
  google_mobile_ads: ^5.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  
  # İŞTE BURASI ÇOK ÖNEMLİ (Hizalama Kritik)
  assets:
    - assets/images/
    - assets/audio/sfx/