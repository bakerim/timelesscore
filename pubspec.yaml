name: timeless_core
description: "A new TimelessCore Puzzle Block Game"
publish_to: 'none' 
version: 1.0.1+3

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Oyun Motoru & Ses
  flame: ^1.18.0
  flame_audio: ^2.1.8
  
  # Gelir Modelleri (Reklam & Satın Alma)
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.2.0
  
  # Veri Saklama
  shared_preferences: ^2.2.3
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/sfx/

# İkon Ayarları (Oyunun kendi logosu kalır)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/splash.jpg" 
  min_sdk_android: 21 

# Açılış Ekranı (Splash) - DÜZELTİLDİ
flutter_native_splash:
  color: "#000000" # Logonun siyah arka planı
  image: assets/images/moving_pixel.png # <-- OLMASI GEREKEN STÜDYO LOGOSU
  fullscreen: true
  android_12:
    image: assets/images/moving_pixel.png # <-- OLMASI GEREKEN STÜDYO LOGOSU
    color: "#000000"
