name: timeless_core
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.1+2

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Oyun Motoru & Ses
  flame: ^1.18.0
  flame_audio: ^2.1.8
  
  # Gelir Modelleri (Reklam & Satın Alma)
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.2.0
  
  # Veri Saklama
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/sfx/
    - assets/translations/

# İkon Ayarları
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/splash.jpg"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/images/splash.jpg"
    background_color: "#0A0E17"
    theme_color: "#0A0E17"
  windows:
    generate: true
    image_path: "assets/images/splash.jpg"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/images/splash.jpg"

# Açılış Ekranı (Splash) - GÜNCELLENDİ
flutter_native_splash:
  color: "#0A0E17"
  image: assets/images/moving_pixel.png
  fullscreen: true
  android_12:
    color: "#0A0E17"
    image: assets/images/moving_pixel.png
    icon_background_color: "#0A0E17"
