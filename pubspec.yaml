name: timeless_core
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flame: ^1.18.0
  flame_audio: ^2.1.8
  google_mobile_ads: 4.0.0
  shared_preferences: 2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/sfx/
    - assets/translations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "assets/images/icon.png"
flutter_native_splash:
  color: "#000000"
  image: assets/images/splash.jpg
  android_12:
    image: assets/images/android12splash.png
    color: "#000000"